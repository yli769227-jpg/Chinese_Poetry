name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install test deps (reward 单测只需 pypinyin + pytest)
        run: pip install pypinyin pytest

      - name: Run reward tests
        run: pytest tests/ -v
